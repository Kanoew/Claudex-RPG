<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14101f">
  <title>Le Sang de Tiamat</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #11141c; color: #f1eddf; font: 14px system-ui, sans-serif; }
    main { height: 100%; height: 100dvh; display: flex; flex-direction: column; max-width: 1400px; margin: auto; }
    header { flex-shrink: 0; padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); }
    .brand { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; gap: 12px; }
    h1 { margin: 0; font: 600 17px Georgia, serif; letter-spacing: .18em; }
    #opponents { color: #a8afb7; font-size: 11px; text-align: right; }
    .resources { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .meter-label { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 11px; letter-spacing: .05em; font-weight: 650; }
    .meter { height: 10px; border: 1px solid #59616a; border-radius: 3px; background: #20262d; overflow: hidden; }
    .meter::before { content: ''; display: block; width: var(--fill, 100%); height: 100%; background: linear-gradient(90deg, #a54759, #ef9d98); }
    #mana-meter::before { background: linear-gradient(90deg, #3b719d, #91d2ed); }
    #objective { margin-top: 9px; color: #e0c58f; font-size: 12px; line-height: 1.3; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    #view { flex: 1; min-height: 0; position: relative; margin: 0 10px; border: 1px solid #3b424c; border-radius: 7px; overflow: hidden; background: #161b24; }
    canvas { display: block; width: 100%; height: 100%; }
    #boss-panel { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: min(340px, calc(100% - 28px)); padding: 8px 12px; background: #12151feb; border: 1px solid #b08a68; border-radius: 5px; pointer-events: none; }
    #boss-panel .meter { height: 7px; border-color: #786078; }
    #boss-meter::before { background: linear-gradient(90deg, #775699, #d9a5dd); }
    #boss-state { color: #e9c58b; letter-spacing: .16em; }
    #result:not([hidden]) { position: absolute; inset: 0; display: grid; place-content: center; gap: 16px; padding: 24px; background: #10141aef; text-align: center; }
    #result-text { font: 600 24px Georgia, serif; max-width: 340px; }
    #result-details { margin: 0; color: #b8c1cb; }
    #retry { min-height: 52px; padding: 12px 24px; border: 1px solid #c9ad78; border-radius: 5px; background: #3f3540; color: #fff2d6; font: bold 15px system-ui; touch-action: manipulation; }
    #controls { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    #joystick { position: relative; flex-shrink: 0; width: 108px; height: 108px; border: 1px solid #737781; border-radius: 50%; background: radial-gradient(circle, #343849, #202631); touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: inset 0 0 0 10px #ffffff05; }
    #joystick::before, #joystick::after { content: ''; position: absolute; background: #69708066; }
    #joystick::before { top: 50%; left: 12px; right: 12px; height: 1px; }
    #joystick::after { left: 50%; top: 12px; bottom: 12px; width: 1px; }
    #stick { position: absolute; top: 50%; left: 50%; width: 48px; height: 48px; margin: -24px; border: 1px solid #d3c3df; border-radius: 50%; background: linear-gradient(135deg, #b5a2c5, #766683); box-shadow: 0 3px 12px #0006; z-index: 1; pointer-events: none; }
    #help { max-width: 380px; color: #a8afb7; font-size: 12px; line-height: 1.7; }
    #help strong { display: block; color: #e0c58f; letter-spacing: .08em; }
    #actions { display: grid; grid-template-columns: repeat(2, 78px); flex-shrink: 0; gap: 8px; }
    #actions button { position: relative; min-width: 0; height: 66px; padding: 8px 2px; border: 1px solid #b7a1ca; border-radius: 8px; background: linear-gradient(#453c54, #302a3d); color: #fcf8ff; font: 700 14px system-ui; touch-action: none; user-select: none; -webkit-user-select: none; }
    #actions small { display: block; margin-top: 5px; font-size: 9px; font-weight: 500; color: #e1d9eb; }
    #actions #skill { border-color: #77b7ce; background: linear-gradient(#284455, #1e303d); }
    #actions #dodge { grid-column: 1 / -1; height: 46px; border-color: #85b39d; background: linear-gradient(#283f37, #1f302b); display: flex; justify-content: center; align-items: center; gap: 10px; }
    #actions #dodge small { margin: 0; }
    #actions button.recovering { background: #20252d; color: #a5acb9; border-color: #4c5461; }
    #actions button.recovering small { color: #a5acb9; }
    #actions #interact { grid-column: 1 / -1; height: 38px; border-color: #a6cadf; background: #263746; }
    #actions button[hidden] { display: none; }
    #story-panel:not([hidden]) { position: absolute; inset: 0; display: grid; align-content: end; gap: 16px; padding: 24px; background: #10141ab8; z-index: 2; }
    #story-panel.over-mirror:not([hidden]) { background: transparent; }
    #story-card { display: flex; align-items: center; gap: 14px; padding: 16px; background: #151c2cf5; border: 1px solid #a6cadf; border-radius: 7px; }
    #story-body { min-width: 0; }
    #story-portrait { width: 72px; height: 72px; flex-shrink: 0; border: 1px solid #a6cadf; border-radius: 6px; image-rendering: auto; }
    #story-portrait[hidden], #story-name[hidden] { display: none; }
    #story-name { margin: 0 0 4px; color: #e0c58f; font: 700 11px system-ui; letter-spacing: .14em; }
    #story-text { margin: 0; font-size: 16px; line-height: 1.55; }
    #story-card.tiamat { background: #14102af7; border-color: #8f7bff; box-shadow: 0 0 22px #6b57e870; }
    #story-card.tiamat #story-text { color: #dcd3ff; font-style: italic; }
    #story-card.tiamat #story-name { color: #a99cff; }
    #story-card.tiamat #story-portrait { border-color: #8f7bff; }
    #story-next { min-height: 48px; padding: 10px; background: #35455c; color: white; border: 1px solid #a6cadf; border-radius: 7px; font: inherit; }
    #pause-button[hidden] { display: none; }
    #pause-button { min-width: 44px; min-height: 36px; padding: 6px 12px; border: 1px solid #59616a; border-radius: 6px; background: #20262d; color: #e0c58f; font: bold 14px system-ui; letter-spacing: .1em; touch-action: manipulation; }
    #menu-panel:not([hidden]) { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: 12px; padding: 24px; background: #0b0e14f2; text-align: center; z-index: 3; }
    #stats-panel:not([hidden]) { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: 14px; padding: 24px; background: #0b0e14f5; text-align: center; z-index: 4; }
    #stats-title { margin: 0; font: 600 24px Georgia, serif; letter-spacing: .2em; }
    #stats-body { margin: 0; max-width: 340px; padding: 16px; border: 1px solid #a6cadf; border-radius: 7px; background: #151c2c; font-size: 15px; line-height: 1.8; white-space: pre-line; }
    #stats-panel button { width: min(300px, 100%); min-height: 52px; border: 1px solid #a6cadf; border-radius: 6px; background: #35455c; color: #fff; font: bold 15px system-ui; }
    #menu-title { margin: 0; font: 600 28px Georgia, serif; letter-spacing: .2em; }
    #menu-note { margin: 0 0 8px; color: #b8c1cb; }
    #menu-panel button { width: min(300px, 100%); min-height: 52px; padding: 12px 18px; border: 1px solid #c9ad78; border-radius: 6px; background: #3f3540; color: #fff2d6; font: bold 15px system-ui; touch-action: manipulation; }
    #menu-panel button[hidden] { display: none; }
    .prologue .resources, .prologue #actions { visibility: hidden; }

    /* Habillage 2026 : violets pâles (Tiamat et Yarden), verre dépoli, coins arrondis. */
    :root { --ink: #f4effc; --muted: #b4abcb; --accent: #cbb8ff; --accent-soft: #e6dcff; --edge: #5b4d86; --glass: #1d1830eb; }
    body { background: radial-gradient(120% 70% at 50% 0%, #2a1f49 0%, #14101f 55%, #0d0b15 100%); color: var(--ink); }
    h1 { color: var(--accent-soft); }
    #opponents { color: var(--muted); }
    #level-chip { padding: 3px 9px; border: 1px solid var(--edge); border-radius: 999px; background: #2b2146; color: var(--accent-soft); font: 700 10px system-ui; letter-spacing: .12em; white-space: nowrap; }
    #level-chip[hidden] { display: none; }
    #credit-chip, #bag-button { padding: 3px 9px; border: 1px solid var(--edge); border-radius: 999px; background: #2b2146; color: var(--accent-soft); font: 700 10px system-ui; letter-spacing: .08em; white-space: nowrap; }
    #bag-button { min-height: 0; cursor: pointer; }
    #credit-chip[hidden], #bag-button[hidden] { display: none; }
    #bag-panel:not([hidden]) { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: 14px; padding: 24px; background: radial-gradient(120% 90% at 50% 20%, #2d2150f7, #0d0b15fa); text-align: center; z-index: 4; }
    #bag-title { margin: 0; font: 600 24px Georgia, serif; letter-spacing: .2em; }
    #bag-body { width: min(340px, 100%); padding: 16px; border: 1px solid #8b78c9; border-radius: 18px; background: var(--glass); font-size: 14px; text-align: left; }
    .bag-credits { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 10px; margin-bottom: 8px; border-bottom: 1px solid #8b78c966; }
    .bag-credits strong { font-size: 26px; }
    .bag-row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; }
    .bag-row b { color: var(--accent-soft); font-weight: 600; text-align: right; }
    .bag-empty { padding: 8px 0; color: var(--muted); }
    #bag-close { width: min(300px, 100%); min-height: 52px; border: 1px solid #8b78c9; border-radius: 16px; background: linear-gradient(#3b2f5f, #2a2144); color: var(--ink); font: bold 15px system-ui; }
    #loot-toast { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); padding: 6px 14px; border: 1px solid #8b78c9; border-radius: 999px; background: #1a1430ee; color: var(--ink); font: 600 13px system-ui; pointer-events: none; z-index: 3; }
    #loot-toast[hidden] { display: none; }
    #loot-toast.show { animation: loot-pop 2.2s ease-out forwards; }
    @keyframes loot-pop { 0% { opacity: 0; transform: translate(-50%, 10px); } 12% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; } }
    .meter { height: 11px; border: 1px solid var(--edge); border-radius: 999px; background: #181226; }
    .meter::before { border-radius: 999px; background: linear-gradient(90deg, #c4609a, #f4b7d8); }
    #mana-meter::before { background: linear-gradient(90deg, #7b8cff, #d5dcff); }
    #boss-meter::before { background: linear-gradient(90deg, #8a63d6, #e1c8ff); }
    .meter-label { color: var(--muted); }
    #objective { color: var(--accent); }
    #view { border: 1px solid var(--edge); border-radius: 20px; box-shadow: 0 14px 44px #0009, inset 0 0 0 1px #ffffff0d; }
    #boss-panel { background: var(--glass); border-color: var(--edge); border-radius: 14px; backdrop-filter: blur(8px); }
    #boss-state { color: var(--accent-soft); }
    #pause-button { border-color: var(--edge); border-radius: 14px; background: #241c3a; color: var(--accent-soft); }
    #actions button { border: 1px solid #8b78c9; border-radius: 18px; background: linear-gradient(#3b2f5f, #2a2144); color: var(--ink); box-shadow: 0 4px 14px #0006; }
    #actions small { color: var(--muted); }
    #actions #skill { border-color: #a9b6ff; background: linear-gradient(#2f3a6a, #232a52); }
    #actions #dodge { border-color: #a9d9cc; background: linear-gradient(#27433f, #1d3330); }
    #actions #interact { border-color: #cbb8ff; background: linear-gradient(#3b2f5f, #2d2448); }
    #actions button.recovering { background: #1c1729; color: #8d84a6; border-color: #3d3358; box-shadow: none; }
    #joystick { border-color: var(--edge); background: radial-gradient(circle, #31285a, #1b1530); }
    #stick { border-color: var(--accent-soft); background: linear-gradient(135deg, #cbb8ff, #8e78d6); }
    #story-panel:not([hidden]) { align-content: start; padding-top: 14px; }
    #story-panel.over-mirror:not([hidden]) { align-content: end; }
    #story-panel.see-through:not([hidden]) { background: transparent; }
    #story-card { border-radius: 18px; border-color: #8b78c9; background: var(--glass); box-shadow: 0 10px 30px #0008; backdrop-filter: blur(8px); }
    #story-portrait { border-radius: 14px; border-color: #8b78c9; }
    #story-name { color: var(--accent); }
    #story-next { border-radius: 14px; border-color: #8b78c9; background: linear-gradient(#3b2f5f, #2a2144); }
    #menu-panel:not([hidden]) { background: radial-gradient(120% 90% at 50% 20%, #2d2150f7, #0d0b15fa); }
    #menu-title { color: var(--accent-soft); text-shadow: 0 0 24px #8e78d6aa; }
    #menu-note { color: var(--muted); }
    #menu-panel button, #stats-panel button { border: 1px solid #8b78c9; border-radius: 16px; background: linear-gradient(#3b2f5f, #2a2144); color: var(--ink); }
    #menu-main, #menu-settings-view { display: grid; gap: 10px; width: min(320px, 100%); justify-items: center; }
    #menu-main[hidden], #menu-settings-view[hidden] { display: none; }
    .slider { display: grid; gap: 6px; width: 100%; color: var(--muted); font-size: 12px; letter-spacing: .06em; text-align: left; }
    .slider input { width: 100%; accent-color: #b9a2ff; height: 28px; }
    #menu-vignette { width: min(360px, 100%); height: auto; margin-top: 6px; }
    #menu-vignette[hidden] { display: none; }
    #stats-panel:not([hidden]) { background: radial-gradient(120% 90% at 50% 20%, #2d2150f7, #0d0b15fa); }
    #stats-body { border-color: #8b78c9; border-radius: 18px; background: var(--glass); }
    #stats-body { width: min(340px, 100%); padding: 18px 16px 16px; font-size: 13px; text-align: left; white-space: normal; }
    .stat-level { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; color: var(--accent); font: 700 12px system-ui; letter-spacing: .2em; }
    .stat-level strong { color: #fff; font: 800 38px Georgia, serif; letter-spacing: 0; text-shadow: 0 0 18px #a98cff99; }
    .stat { display: grid; grid-template-columns: 44px 1fr 34px; align-items: center; gap: 10px; margin: 7px 0; }
    .stat-name { color: var(--muted); font: 800 12px system-ui; letter-spacing: .14em; }
    .stat b { text-align: right; color: #fff; font: 800 15px system-ui; }
    .stat-bar { display: block; height: 11px; background: #150f24; border: 1px solid #4a3d73; transform: skewX(-18deg); overflow: hidden; }
    .stat-bar i { display: block; height: 100%; background: linear-gradient(90deg, #8e78d6, #e1d5ff); box-shadow: 0 0 10px #b9a2ff88; }
    .stat.vie .stat-bar i { background: linear-gradient(90deg, #c4609a, #f4b7d8); }
    .stat.mana .stat-bar i { background: linear-gradient(90deg, #7b8cff, #d5dcff); }
    .stat.infini .stat-bar i { background: linear-gradient(90deg, #6f5ac7, #ffffff, #6f5ac7); }
    .stat-line { margin-top: 10px; padding-top: 8px; border-top: 1px solid #3d3358; color: var(--accent-soft); }
    #result:not([hidden]) { background: #0d0b15f2; }
    #retry { border-color: #8b78c9; border-radius: 16px; background: linear-gradient(#3b2f5f, #2a2144); color: var(--ink); }
    button:focus-visible { outline: 3px solid #fff1c2; outline-offset: 3px; }
    button:active { filter: brightness(1.2); }
    @media (max-width: 650px) { #help { display: none; } }
    @media (orientation: landscape) and (max-height: 500px) {
      header { padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: 6px; }
      .brand { margin-bottom: 5px; }
      h1 { font-size: 14px; }
      .resources { max-width: 480px; }
      #objective { position: absolute; right: max(16px, env(safe-area-inset-right)); top: 28px; max-width: 35%; margin: 0; }
      #controls { padding-top: 6px; padding-bottom: max(6px, env(safe-area-inset-bottom)); }
      #joystick { width: 96px; height: 96px; }
      #actions { grid-template-columns: repeat(3, 78px); }
      #actions #dodge { grid-column: auto; height: 66px; display: block; }
      #actions #dodge small { margin-top: 5px; }
      #help { display: none; }
    }
    @media (orientation: landscape) and (max-width: 750px) { .resources { max-width: 55%; } }
  </style>

<body>
  <main id="app">
    <header>
      <div class="brand"><h1>YARDEN</h1><span id="level-chip" hidden>NIV. 1</span><span id="credit-chip" hidden>0 ¢</span><button id="bag-button" type="button" hidden>Sac</button><span id="opponents">Chapitre 1</span><button id="pause-button" type="button" aria-label="Pause">II</button></div>
      <div class="resources">
        <div><div class="meter-label"><span>VIE</span><span id="hp-value">5 / 5</span></div><div class="meter" id="hp-meter" role="progressbar" aria-label="Points de vie de Yarden" aria-valuemin="0" aria-valuemax="5" aria-valuenow="5"></div></div>
        <div><div class="meter-label"><span>MANA</span><span id="mana-value">30 / 30</span></div><div class="meter" id="mana-meter" role="progressbar" aria-label="Mana de Yarden" aria-valuemin="0" aria-valuemax="30" aria-valuenow="30"></div></div>
      </div>
      <div id="status" class="sr-only"></div><div id="objective" role="status"></div>
    </header>
    <div id="view">
      <canvas id="game" tabindex="-1" aria-label="Prends la faux, affronte les monstres, puis traverse l’antre de l’araignée. Orange : attaque annoncée ; vert : esquive.">Votre navigateur doit prendre en charge Canvas.</canvas>
      <div id="boss-panel" hidden><div class="meter-label"><span id="boss-state">TROLL</span><span id="boss-value">8 / 8</span></div><div class="meter" id="boss-meter" role="progressbar" aria-label="Points de vie du Gardien" aria-valuemin="0" aria-valuemax="8" aria-valuenow="8"></div></div>
      <div id="result" hidden><strong id="result-text" role="status"></strong><p id="result-details"></p><button id="retry" type="button">Recommencer le donjon</button></div>
      <div id="menu-panel" role="dialog" aria-modal="true" aria-labelledby="menu-title" hidden>
        <h2 id="menu-title">Le Sang de Tiamat</h2><p id="menu-note"></p>
        <div id="menu-main"><button id="menu-continue" type="button">Continuer</button><button id="menu-new" type="button">Commencer</button><button id="menu-resume" type="button">Reprendre</button><button id="menu-stats" type="button" hidden>Statistiques</button><button id="menu-settings" type="button">Paramètres</button><button id="menu-restart" type="button">Revenir au dernier point de passage</button></div>
        <div id="menu-settings-view" hidden><button id="menu-music" type="button">Musique : activée</button><label class="slider">Volume de la musique<input id="menu-music-volume" type="range" min="0" max="100" step="5" value="60"></label><button id="menu-effects" type="button">Effets : activés</button><label class="slider">Volume des effets<input id="menu-effects-volume" type="range" min="0" max="100" step="5" value="60"></label><button id="menu-back" type="button">Retour</button></div>
        <canvas id="menu-vignette" width="360" height="170" hidden aria-hidden="true"></canvas>
      </div>
      <div id="bag-panel" role="dialog" aria-modal="true" aria-labelledby="bag-title" hidden><h2 id="bag-title">Sac</h2><div id="bag-body" role="group"></div><button id="bag-close" type="button">Fermer</button></div>
      <div id="loot-toast" role="status" hidden></div>
      <div id="stats-panel" role="dialog" aria-modal="true" aria-labelledby="stats-title" hidden><h2 id="stats-title">Yarden</h2><div id="stats-body" role="group"></div><button id="stats-close" type="button">Fermer</button></div>
      <div id="story-panel" role="dialog" aria-modal="true" aria-labelledby="story-text" hidden><div id="story-card"><canvas id="story-portrait" width="144" height="144" hidden></canvas><div id="story-body"><p id="story-name" hidden></p><p id="story-text"></p></div></div><button id="story-next" type="button">Continuer</button></div>
    </div>
    <div id="controls">
      <div id="joystick" aria-label="Joystick tactile de déplacement"><div id="stick"></div></div>
      <div id="help"><strong>L’ABYSSE · CHAPITRE 1</strong>Prends la faux, vaincs le gobelin, l’ogre et le Troll, puis trouve la sortie.<br>Flèches / ZQSD / WASD · Espace · E · Maj</div>
      <div id="actions">
        <button id="attack" type="button" aria-label="Faux gratuite" aria-disabled="true">Faux<small id="attack-hint">À récupérer</small></button>
        <button id="skill" type="button" aria-label="Fauchage, deux dégâts, 20 mana" aria-disabled="true">Fauchage<small id="skill-hint">À récupérer</small></button>
        <button id="dodge" type="button" aria-label="Esquive gratuite" aria-disabled="false">Esquive<small id="dodge-hint">Gratuite · Maj</small></button>
        <button id="interact" type="button" aria-label="Utiliser le cristal noir, touche F" aria-disabled="true" hidden>Cristal · F</button>
      </div>
    </div>
  </main>
</body>
</html>
