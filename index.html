<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121320">
  <title>Yarden — Premiers pas dans l’Abysse</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #121320; color: #eae7f5; font: 15px system-ui, sans-serif; }
    main { height: 100%; height: 100dvh; display: flex; flex-direction: column; }
    header { padding: max(14px, env(safe-area-inset-top)) 20px 12px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: .12em; }
    header p { margin: 5px 0 0; color: #b5afca; font-size: 13px; }
    #view { flex: 1; min-height: 0; position: relative; margin: 0 12px; border-radius: 12px; overflow: hidden; background: #1a1c2c; }
    #status { color: #eae7f5; font-size: 13px; }
    #result:not([hidden]) { position: absolute; inset: 0; display: grid; place-content: center; gap: 14px; padding: 20px; background: #121320dd; text-align: center; }
    #retry { min-height: 52px; padding: 12px 24px; border: 2px solid #c5afff; border-radius: 10px; background: #46365f; color: #fff; font: bold 16px system-ui; touch-action: manipulation; }
    canvas { display: block; width: 100%; height: 100%; }
    #controls { flex-shrink: 0; display: flex; align-items: center; gap: 24px; padding: 14px max(20px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
    #joystick { position: relative; flex-shrink: 0; width: 132px; height: 132px; border: 2px solid #70678e; border-radius: 50%; background: #252337; touch-action: none; user-select: none; -webkit-user-select: none; }
    #joystick::before, #joystick::after { content: ''; position: absolute; background: #39344f; }
    #joystick::before { top: 50%; left: 12px; right: 12px; height: 1px; }
    #joystick::after { left: 50%; top: 12px; bottom: 12px; width: 1px; }
    #stick { position: absolute; top: 50%; left: 50%; width: 54px; height: 54px; margin: -27px; border-radius: 50%; background: #c5afff; box-shadow: 0 3px 16px #0005; z-index: 1; pointer-events: none; }
    #help { max-width: 320px; color: #b5afca; line-height: 1.6; font-size: 13px; }
    #help strong { display: block; color: #eae7f5; font-size: 14px; }
    #controls { justify-content: space-between; }
    #attack { flex-shrink: 0; width: 88px; height: 88px; border: 2px solid #c5afff; border-radius: 50%; background: #46365f; color: #fff; font: bold 16px system-ui; touch-action: none; user-select: none; -webkit-user-select: none; }
    #attack.recovering { background: #252337; color: #b5afca; border-color: #70678e; }
    #attack:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    #actions { display: flex; flex-shrink: 0; gap: 8px; }
    #actions button { width: 72px; height: 80px; border: 2px solid #c5afff; border-radius: 22px; background: #46365f; color: #fff; font: bold 13px system-ui; touch-action: none; user-select: none; -webkit-user-select: none; }
    #actions small { display: block; margin-top: 4px; font-weight: normal; }
    #actions #skill { border-color: #70ddff; background: #214253; }
    #actions button.recovering { background: #252337; color: #b5afca; border-color: #70678e; }
    #actions button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    @media (max-width: 600px) {
      #controls { gap: 12px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
      #joystick { width: 120px; height: 120px; }
    }
    @media (max-width: 600px) { #help { display: none; } }
    @media (orientation: landscape) and (max-height: 500px) {
      header { padding: 8px 20px; } h1 { font-size: 18px; } header p { display: none; }
      #controls { padding-top: 8px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
      #joystick { width: 104px; height: 104px; }
    }
  </style>
  <script src="game.js?v=7" defer></script>
</head>
<body>
  <main>
    <header><h1>YARDEN</h1><p>L’Abysse · Étape 5 · Mana et Fauchage</p><div id="status" role="status" aria-live="polite"></div></header>
    <div id="view">
      <canvas id="game" aria-label="Yarden, disque violet, affronte un ennemi rose dans une salle avec deux blocs solides.">Votre navigateur doit prendre en charge Canvas.</canvas>
      <div id="result" hidden><strong id="result-text" role="status"></strong><button id="retry" type="button">Recommencer le duel</button></div>
    </div>
    <div id="controls">
      <div id="joystick" aria-label="Joystick tactile de déplacement"><div id="stick"></div></div>
      <div id="help"><strong>Fauchage</strong>Un coup plus large, deux dégâts. Le mana revient à 3/s.<br>PC : Espace = Faux · E = Fauchage.</div>
      <div id="actions">
        <button id="attack" type="button" aria-label="Faux, coût de 3 points de mana" aria-disabled="false">Faux<small>3 mana</small></button>
        <button id="skill" type="button" aria-label="Fauchage, deux dégâts, coût de 12 points de mana" aria-disabled="false">Fauchage<small>12 mana</small></button>
      </div>
    </div>
  </main>
</body>
</html>
