name: Nettoyage Actions

on:
  workflow_dispatch:
    inputs:
      keep_days:
        description: "Garder les N derniers jours"
        default: "2"
  schedule:
    - cron: "17 3 * * 0"   # chaque dimanche

permissions:
  actions: write
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Supprimer artefacts, caches et anciens runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ inputs.keep_days || '2' }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "-$DAYS days" +%Y-%m-%dT%H:%M:%SZ)

          echo "Artefacts"
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.created_at < \"$cutoff\") | .id" \
          | while read -r id; do gh api -X DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null; done

          echo "Caches"
          gh cache delete --all || true

          echo "Anciens runs"
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.status==\"completed\" and .created_at < \"$cutoff\") | .id" \
          | while read -r id; do gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null; done
